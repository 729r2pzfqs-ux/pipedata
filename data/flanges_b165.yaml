# ASME B16.5 — Pipe Flanges and Flanged Fittings, NPS 1/2 through NPS 24
#
# All dimensions in inches.
#   o        flange outside diameter
#   tf       minimum flange thickness (raised face NOT included)
#   bc       bolt circle diameter
#   bolts    number of bolt holes
#   bolt     bolt diameter (nominal)
#   y_wn     length through hub, welding neck
#   y_so     length through hub, slip-on / threaded / socket weld
#
# y_wn / y_so are carried for Classes 150 and 300 only; for the higher classes
# the hub geometry varies by bore and the generator renders those cells as "—".

# Raised-face outside diameter (gasket contact OD). Common to Classes 150-600.
# Classes 900, 1500 and 2500 use different gasket surfaces in several sizes —
# see ASME B16.5 Table 9 before ordering a gasket for those classes.
