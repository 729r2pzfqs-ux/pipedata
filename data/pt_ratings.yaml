# ASME B16.5 pressure-temperature ratings, in psig.
# Temperatures in °F. The first column is the -20 °F to 100 °F band.
#
# A rating is the maximum allowable working gauge pressure for that material
# group at that metal temperature. Interpolation between listed temperatures is
# permitted by B16.5; extrapolation is not.

temperatures: [100, 200, 300, 400, 500, 600, 650, 700, 750, 800, 850, 900, 950, 1000]
#
# Provenance (checked 2026-09-28). The standard itself was not consulted; the
# values were checked against secondary reproductions of the B16.5 tables
# (flange and valve manufacturers' rating sheets). Where two or more
# independent sources agree the group is marked `checked: full`. Where part of
# a table rests on one source it is marked `checked: partial` and `caveat`
# says which part; the page prints the caveat.
#
# `materials` lists the forgings, castings and plate that B16.5 Table 1A puts
# in the group. Pipe is not a Table 1A material, so the pipe normally used
# with the group is carried separately in `pipe`.
#
# Corrected on 2026-09-28:
#   - Group 1.1 Classes 300-2500 carried 1988/1996-edition values above 800 °F
#     and in parts of the 200-400 °F and 700 °F columns.
#   - Group 1.2 carried values that belong to no edition of Group 1.2, and a
#     material list that was mostly Group 1.1.
#   - Group 2.1 listed 316 materials and carried old Group 2.2 (316) values.
#     316 is Group 2.2, which is now its own entry.

