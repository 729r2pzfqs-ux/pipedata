# ASME B16.5 pressure-temperature ratings, in psig.
# Temperatures in °F. The first column is the -20 °F to 100 °F band.
#
# A rating is the maximum allowable working gauge pressure for that material
# group at that metal temperature. Interpolation between listed temperatures is
# permitted by B16.5; extrapolation is not.

temperatures: [100, 200, 300, 400, 500, 600, 650, 700, 750, 800, 850, 900, 950, 1000]

