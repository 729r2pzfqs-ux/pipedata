# ASME B16.47 — Large Diameter Steel Flanges, NPS 26 through NPS 60
#
# B16.47 carries two series that are, in general, not interchangeable:
#   Series A — derived from MSS SP-44. Heavier, larger OD, larger bolting.
#   Series B — derived from API 605. Lighter, smaller OD, more/smaller bolts.
# In Classes 75, 150 and 300, and in NPS 36 and smaller in Classes 400, 600
# and 900, a Series A flange will not bolt to a Series B flange of the same
# size and class. At NPS 38 and larger in Classes 400, 600 and 900 the two
# series have the same dimensions.
#
# The standard covers welding neck and blind flanges only.
#
# `tf` is the minimum flange thickness. In Series A Class 150 it is the same
# for the welding neck and the blind flange, and it does NOT include the
# 0.06 in (2 mm) raised face.
#
# Checked on 2026-09-28 against the text of B16.47-2017 and two distributor
# tables that agree with it. The 2025 edition is current; its dimension table
# was not read, and no dimensional change is reported. Corrected then:
#   - every `tf` was 0.7 to 1.9 in too thin, matching no series or edition;
#   - `bolt` for NPS 50 was 1 1/2 and for NPS 52 to 60 was 1 5/8. It is 1 3/4
#     for all six sizes (1 5/8 is the bolt HOLE of the 1 1/2 in bolts);
#   - the size ranges of the higher classes were not stated.
# `o`, `bc` and `bolts` were correct in all 18 rows.
#
# Dimensions in inches.
#
# COVERAGE NOTE: full dimensional tables are published here for Series A
# Class 150 only. The remaining series/class combinations are described but
# not tabulated — see the `tabulated` flag on each combination below.

series:
  a:
    name: "Series A"
    origin: "MSS SP-44"
    sizes: "NPS 26 through NPS 60, Class 900 through NPS 48"
    classes: ["150", "300", "400", "600", "900"]
    blurb: >-
      Series A is the heavier of the two large-flange series, which the
      standard describes as the one for general use. It has a larger outside
      diameter, a thicker flange and fewer, larger bolts than Series B at the
      same size and class. Class 900 is published through NPS 48 only.
  b:
    name: "Series B"
    origin: "API 605"
    sizes: "NPS 26 through NPS 60, Class 900 through NPS 48"
    classes: ["75", "150", "300", "400", "600", "900"]
    blurb: >-
      Series B is the lighter, compact series, carried over from API 605. It
      uses a smaller outside diameter and a larger number of smaller-diameter
      bolts, which makes it thinner and cheaper but leaves less flange
      rigidity. It also carries a Class 75 rating that Series A does not. In
      Classes 400, 600 and 900 it has dimensions of its own through NPS 36
      only; from NPS 38 up it uses the Series A dimensions.

combinations:
  - {series: a, class: "150", tabulated: true}
  - {series: a, class: "300", tabulated: false}
  - {series: a, class: "400", tabulated: false}
  - {series: a, class: "600", tabulated: false}
  - {series: a, class: "900", tabulated: false}
  - {series: b, class: "75",  tabulated: false}
  - {series: b, class: "150", tabulated: false}
  - {series: b, class: "300", tabulated: false}
  - {series: b, class: "400", tabulated: false}
  - {series: b, class: "600", tabulated: false}
  - {series: b, class: "900", tabulated: false}

