  - slug: eccentric-reducer
    name: "Eccentric Reducer"
    short: "eccentric reducer"
    dim_label: "End-to-end H"
    formula: null
    blurb: >-
      Same end-to-end length as the concentric reducer, but the two ends share
      a common tangent rather than a common centreline. Installed flat-side-up
      on pump suction to avoid trapping vapour, and flat-side-down on horizontal
      runs to avoid trapping liquid.
