  - slug: 45-degree-elbow
    name: "45° Long Radius Elbow"
    short: "45° elbow"
    dim_label: "Centre-to-end B"
    formula: null
    blurb: >-
      A half-turn on nominally the same centreline radius as the long radius
      90°. Two of them make a rolling offset without the pressure drop of a
      pair of 90s. Dimension B is tabulated size by size and cannot be
      calculated from the radius.
    rows:
      "1/2": 0.62
      "3/4": 0.75
      "1": 0.88
      "1 1/4": 1.00
      "1 1/2": 1.12
