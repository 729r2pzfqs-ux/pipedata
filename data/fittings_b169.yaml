# ASME B16.9 — Factory-Made Wrought Buttwelding Fittings
#
# All dimensions in inches, measured from the centre of the fitting to the
# welding end ("centre-to-end") unless the fitting note says otherwise.
# B16.9 sets these dimensions from NPS, so one table covers every schedule in
# a size. Two exceptions: the length of a CAP is longer above a limiting wall
# thickness (see `limit_wall` and `rows_heavy` on the cap), and lap joint stub
# ends, which are not carried here at all.
#
# Checked on 2026-09-28 against the text of B16.9-2003, B16.9-2018 and
# B16.9-2024 as hosted publicly, and three independent charts. The three
# editions agree on every value carried here. Corrected then:
#   - 90 LR elbow NPS 3/4 was 1.12; it is 1.50.
#   - 45 elbow NPS 3/4 was 0.44; it is 0.75. NPS 22 was 13.75; it is 13.50.
#   - Reducers listed a large end of NPS 1/2. The smallest reducer is 3/4 x 1/2.
#   - The 45 elbow formula reproduced no tabulated value and was removed.
#   - The cap had no mention of the longer length for heavy wall.
#
# Coverage limits, not errors: B16.9 runs to NPS 48 and this file stops at
# NPS 24. Lap joint stub ends (B16.9 Table 6.1-9, and MSS SP-43 for light
# wall), 3D elbows, reducing elbows and short radius returns are not carried.

fittings:
  - slug: 90-degree-elbow
    name: "90° Long Radius Elbow"
    short: "90° LR elbow"
    dim_label: "Centre-to-end A"
    formula: "A = 1.5 × NPS from NPS 1 up; 1.50 in at NPS 1/2 and 3/4"
    blurb: >-
      The default elbow in process piping. From NPS 1 upward its centreline
      radius is 1.5 times the nominal pipe size, which keeps pressure drop low
      and leaves room for a weld on both ends. NPS 1/2 and NPS 3/4 are made to
      the NPS 1 dimension.
    rows:
      "1/2": 1.50
      "3/4": 1.50
      "1": 1.50
      "1 1/4": 1.88
      "1 1/2": 2.25
      "2": 3.00
      "2 1/2": 3.75
      "3": 4.50
      "3 1/2": 5.25
      "4": 6.00
      "5": 7.50
      "6": 9.00
      "8": 12.00
      "10": 15.00
      "12": 18.00
      "14": 21.00
      "16": 24.00
      "18": 27.00
      "20": 30.00
      "22": 33.00
      "24": 36.00

  - slug: 90-degree-elbow-short-radius
    name: "90° Short Radius Elbow"
    short: "90° SR elbow"
    dim_label: "Centre-to-end A"
    formula: "A = 1.0 × NPS"
    blurb: >-
      A tighter 90° turn with a centreline radius equal to the nominal pipe
      size. Used where space will not allow a long radius elbow; it costs more
      pressure drop and more erosion at the extrados.
    rows:
      "1": 1.00
      "1 1/4": 1.25
      "1 1/2": 1.50
      "2": 2.00
      "2 1/2": 2.50
      "3": 3.00
      "3 1/2": 3.50
