  - slug: concentric-reducer
    name: "Concentric Reducer"
    short: "concentric reducer"
    dim_label: "End-to-end H"
    formula: null
    blurb: >-
      A reducer whose two ends share a common centreline. Used on vertical runs
      and anywhere the pipe centreline must stay put through the size change.
      The length H is set by the LARGER of the two ends. The smallest reducer
      in B16.9 is NPS 3/4 by 1/2.
