  - slug: 180-degree-return-bend
    name: "180° Long Radius Return Bend"
    short: "180° LR return"
    dim_label: "Centre-to-centre O"
    formula: "O = 2 × A (90° LR elbow)"
    blurb: >-
      A long radius elbow doubled back on itself — literally two 90° long
      radius elbows joined at their tangent, on the same 1.5 x NPS centreline
      radius. Used to reverse flow direction in a tight footprint, most often
      in fired heater and boiler tube coils.
