  - slug: cap
    name: "Cap"
    short: "buttweld cap"
    dim_label: "Length E"
    formula: null
    blurb: >-
      A domed end closure welded onto the end of a run. E is measured from the
      welding end to the outside of the crown, so it is the length the cap adds
      to the pipe.
