  - slug: cap
    name: "Cap"
    short: "buttweld cap"
    dim_label: "Length E"
    formula: null
    blurb: >-
      A domed end closure welded onto the end of a run. E is measured from the
      welding end to the outside of the crown, so it is the length the cap adds
      to the pipe. It is the one B16.9 dimension on this site that depends on
      the wall thickness.
    extra: >-
      The length in the main table applies up to the limiting wall thickness
      for the size. A cap with a heavier wall is longer. Editions up to 2018
      call the longer length E1; the 2024 edition calls both E.
