  - slug: straight-tee
    name: "Straight Tee"
    short: "equal tee"
    dim_label: "Centre-to-end C and M"
    formula: null
    blurb: >-
      An equal (straight) tee, where the branch is the same size as the run.
      The run dimension C and the branch dimension M are equal in a straight
      tee, so one column covers both.
