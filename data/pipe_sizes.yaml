# ASME B36.10M — Welded and Seamless Wrought Steel Pipe
# Wall thicknesses in inches. `od` is the nominal outside diameter in inches.
# `dn` is the ISO/metric designator (Diameter Nominal, mm).
#
# Schedule keys: 5, 10, 20, 30, 40, 60, 80, 100, 120, 140, 160, STD, XS, XXS.
# STD/XS/XXS are listed explicitly even where they coincide with a numbered
# schedule, because that coincidence breaks at NPS 12 (STD) and NPS 10 (XS)
# and the pages call it out size by size.

