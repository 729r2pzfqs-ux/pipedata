# ASME B36.19M — Stainless Steel Pipe
#
# The S-schedules. Wall thicknesses in inches; outside diameters are the same
# as B36.10M and are read from pipe_sizes.yaml rather than repeated here.
#
# B36.19M is a SHORTER standard than B36.10M in two ways that matter:
#   - it publishes 40S and 80S only through NPS 12
#   - it publishes 5S and 10S only through NPS 30
# Anything outside that is a B36.10M schedule, whatever the material.
#
# The wall thicknesses themselves coincide with the B36.10M schedules in most
# sizes. The divergences are few, specific, and the whole reason this page
# exists — see `divergences` below, which the generator renders rather than
# hardcoding the claim in prose.

schedules: ["5S", "10S", "40S", "80S"]

sizes:
  "1/8":   {10S: 0.049, 40S: 0.068, 80S: 0.095}
  "1/4":   {10S: 0.065, 40S: 0.088, 80S: 0.119}
  "3/8":   {10S: 0.065, 40S: 0.091, 80S: 0.126}
  "1/2":   {5S: 0.065, 10S: 0.083, 40S: 0.109, 80S: 0.147}
  "3/4":   {5S: 0.065, 10S: 0.083, 40S: 0.113, 80S: 0.154}
  "1":     {5S: 0.065, 10S: 0.109, 40S: 0.133, 80S: 0.179}
  "1 1/4": {5S: 0.065, 10S: 0.109, 40S: 0.140, 80S: 0.191}
  "1 1/2": {5S: 0.065, 10S: 0.109, 40S: 0.145, 80S: 0.200}
