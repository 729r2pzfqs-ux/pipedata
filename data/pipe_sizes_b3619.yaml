# Which B36.10M schedule each S-schedule is usually confused with. The
# generator computes the actual agreements and disagreements from the two data
# files rather than trusting this mapping, so a data edit cannot leave a stale
# claim in the prose.
counterparts:
  "5S": "5"
  "10S": "10"
  "40S": "40"
  "80S": "80"
