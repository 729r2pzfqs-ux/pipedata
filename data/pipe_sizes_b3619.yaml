# ASME B36.19 — Welded and Seamless Wrought Stainless Steel Pipe
# (published as B36.19M until the 2022 edition)
#
# The S-schedules. Wall thicknesses in inches; outside diameters are the same
# as B36.10 and are read from pipe_sizes.yaml rather than repeated here.
#
# Coverage, from Table 2-1 of the 2022 edition:
#   - 5S starts at NPS 1/2; 10S, 40S and 80S start at NPS 1/8
#   - 5S and 10S run through NPS 30, with no NPS 26 or 28
#   - 40S and 80S run through NPS 24, except NPS 22, which has neither
# Above NPS 12 every 40S wall is 0.375 in and every 80S wall is 0.500 in. The
# standard itself marks those as not conforming to B36.10.
#
# Where an S-schedule differs from the B36.10 schedule of the same number is
# computed by the generator from the two files, not written down here.
#
# Checked on 2026-09-28 against the text of B36.19-2022 and four independent
# charts. Every wall that was in the file was correct. Added then: 40S and 80S
# for NPS 14, 16, 18, 20 and 24, and the NPS 22 row, which had been left out
# in the belief that 40S and 80S stop at NPS 12.
#
# NOT CARRIED: Schedule 160S, which the 2022 edition added for NPS 1/8 to 6.

schedules: ["5S", "10S", "40S", "80S"]

sizes:
  "1/8":   {10S: 0.049, 40S: 0.068, 80S: 0.095}
  "1/4":   {10S: 0.065, 40S: 0.088, 80S: 0.119}
