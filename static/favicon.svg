<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PipeData">
  <rect width="64" height="64" rx="12" fill="#2B4C7E"/>
  <!-- pipe barrel, seen side-on -->
  <rect x="4" y="20" width="56" height="24" rx="3" fill="#FFFFFF"/>
  <!-- flange collars at both ends -->
  <rect x="4" y="18" width="9" height="28" rx="2" fill="#D35400"/>
  <rect x="51" y="18" width="9" height="28" rx="2" fill="#D35400"/>
  <!-- bore, so the shape still reads as a pipe at 16px -->
  <rect x="13" y="27" width="38" height="10" rx="2" fill="#2B4C7E"/>
</svg>
